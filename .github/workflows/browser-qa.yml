name: KUKAC 3D Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/kukac-http.log 2>&1 &
      - name: Guest and landscape smoke test
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            try{
              for(const vp of [{name:'desktop',width:1440,height:900,mobile:false},{name:'portrait',width:390,height:844,mobile:true},{name:'landscape',width:844,height:390,mobile:true}]){
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},isMobile:vp.mobile,hasTouch:vp.mobile});
                const errors=[];page.on('pageerror',e=>errors.push(String(e)));
                await page.goto('http://127.0.0.1:4173/?qa=1&seed=42');
                if(await page.locator('#accountBtn,#loginForm,#registerForm').count())throw Error('Account UI remains');
                if(vp.name==='portrait'&&!await page.locator('#rotateHint').isVisible())throw Error('Portrait hint missing');
                if(vp.name==='landscape'&&await page.locator('#rotateHint').isVisible())throw Error('Landscape blocked');
                await page.locator('#startBtn').click({force:true});
                if(await page.locator('#start').isVisible())throw Error('Guest start failed');
                if(await page.locator('canvas').count()!==1)throw Error('Canvas missing');
                if(vp.mobile&&await page.locator('#boost').evaluate(e=>getComputedStyle(e).display==='none'))throw Error('Boost missing');
                if(errors.length)throw Error(errors.join(' | '));
                await page.screenshot({path:'qa-'+vp.name+'.png'});
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kukac-browser-qa
          path: qa-*.png
