name: KUKAC 3D Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and Playwright
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare local D1 and start Worker
        run: |
          npm run build
          npm run db:migrate:local
          npx wrangler dev --local --port 4173 >/tmp/kukac-worker.log 2>&1 &
          echo $! > /tmp/kukac-worker.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/kukac-worker.log
          exit 1
      - name: Run D1 account and score API QA
        env:
          KUKAC_QA_ORIGIN: http://127.0.0.1:4173
        run: node scripts/api-qa.mjs
      - name: Run responsive browser smoke tests
        env:
          KUKAC_QA_ORIGIN: http://127.0.0.1:4173
        run: node scripts/browser-qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukac-browser-qa
          path: qa-artifacts/*.png
          if-no-files-found: ignore
