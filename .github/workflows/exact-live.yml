name: KUKAC Exact-Live Production Audit
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected main commit SHA
        required: true
  workflow_run:
    workflows: ["KUKAC 3D Browser QA"]
    types: [completed]
permissions:
  contents: read
jobs:
  exact-live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live assets and guest start
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha }}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch(),base='https://kukac.vipach.at/';
            try{
              const page=await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true});
              for(const file of ['index.html','styles.css','game.js','i18n.js']){
                const response=await page.request.get(base+file+'?sha='+process.env.EXPECTED_SHA);
                if(response.status()!==200||await response.text()!==fs.readFileSync(file,'utf8'))throw Error('Live mismatch: '+file);
              }
              await page.goto(base+'?audit='+Date.now());
              if(await page.locator('#accountBtn,#loginForm').count())throw Error('Account remains');
              await page.locator('#startBtn').click();
              if(await page.locator('#start').isVisible())throw Error('Guest start failed');
              if(await page.locator('canvas').count()!==1)throw Error('Canvas missing');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
